name: Auto Renew Bot-hosting

on:
  schedule:
    - cron: '0 8 * * *' # 每2天UTC 1点 (北京时间9点, 一般都会推迟),自行根据服务到期时间调整
  workflow_dispatch:

jobs:
  Renew-bot:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        timeout-minutes: 25
        run: |
          # GitHub runner 偶发 DNS 故障: Temporary failure resolving 'azure.archive.ubuntu.com'
          # 1) 检测 ubuntu 镜像域名解析, 异常时切换公共 DNS
          if ! getent hosts azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com > /dev/null 2>&1; then
            echo "⚠️ 检测到 ubuntu 镜像域名解析异常, 切换公共 DNS"
            printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /etc/resolv.conf > /dev/null
          fi
          # 2) 避开 Azure 内部镜像, 改用官方公共源 (noble 的 deb822 源走 mirror+file 重写)
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          # 3) 更新索引并安装, 失败自动重试
          apt_ok=0
          for i in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=5 \
              && sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget; then
              apt_ok=1
              break
            fi
            echo "⚠️ 第 $i/3 次 apt 安装失败, 60 秒后重试..."
            sleep 60
          done
          if [ "$apt_ok" != "1" ]; then
            echo "❌ 系统依赖安装失败"
            exit 1
          fi
          pip install seleniumbase requests
          for i in 1 2 3; do
            if seleniumbase install chromedriver; then
              break
            fi
            echo "⚠️ 第 $i/3 次 chromedriver 下载失败, 60 秒后重试..."
            sleep 60
          done

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          EMAIL: ${{ secrets.EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum python3 app.py

      - name: 📦 上传调试现场 (如生成)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chromedriver || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
